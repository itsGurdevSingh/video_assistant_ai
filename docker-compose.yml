services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: video-assistant-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: video_assistant

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

  whisper:
    image: ghcr.io/ggml-org/whisper.cpp:main
    container_name: video-assistant-whisper

    entrypoint: whisper-server

    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -m
      - /models/ggml-base.bin

    ports:
      - "8080:8080"

    volumes:
      - ./docker/whisper/models:/models

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    container_name: video-assistant-embeddings

    command:
      - --model-id
      - BAAI/bge-small-en-v1.5

    ports:
      - "8081:80"

    volumes:
      - embeddings_data:/data

volumes:
  postgres_data:
  embeddings_data: